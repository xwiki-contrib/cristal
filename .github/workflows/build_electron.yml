name: Electron Build for all platforms

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

## Don't build concurrently for a given branch.
## Only the most recent version is built.
concurrency:
  group: ${{ github.ref }}

permissions: write-all

## electron-builder uploads the artifacts itself, to a draft release named after the tag, but only for tag builds.
## Branch builds expose them as run artifacts instead.
jobs:
  electron-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - id: restore-cache-electron-linux
        uses: actions/cache@v6
        with:
          path: |
            .nx/
          key: ${{ github.ref }}-restore-cache-electron-linux
      - run: pnpm update -r --no-save
      - run: cat pnpm-lock.yaml
      - run: git config --global user.email "tmp@xwiki.org"
      - run: git config --global user.name "XWiki Dev Team"
      - run: git commit -am "commit updated lockfile"
      - run: pnpm run build
      - run: sudo apt update
      - run: sudo apt install flatpak-builder
      - run: flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - run: pnpm run --filter @xwiki/cristal-electron build:linux
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: cristal-linux
          path: |
            electron/dist/cristal-*.*
            electron/dist/latest*.yml
          retention-days: 14
          # The files are already compressed installers, deflating them again only slows the upload down.
          compression-level: 0
          if-no-files-found: error
  electron-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - id: restore-cache-electron-mac
        uses: actions/cache@v6
        with:
          path: |
            .nx/
          key: ${{ github.ref }}-restore-cache-electron-mac
      - run: pnpm update -r --no-save
      - run: cat pnpm-lock.yaml
      - run: git config --global user.email "tmp@xwiki.org"
      - run: git config --global user.name "XWiki Dev Team"
      - run: git commit -am "commit updated lockfile"
      - run: pnpm run build
      - run: pnpm run --filter @xwiki/cristal-electron build:mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: cristal-mac
          path: |
            electron/dist/cristal-*.*
            electron/dist/latest*.yml
          retention-days: 14
          # The files are already compressed installers, deflating them again only slows the upload down.
          compression-level: 0
          if-no-files-found: error
  electron-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - id: restore-cache-electron-win
        uses: actions/cache@v6
        with:
          path: |
            .nx/
            !.nx/workspace-data/d
          key: ${{ github.ref }}-restore-cache-electron-win
        env:
          NX_DISABLE_DB: true
          NX_DB_CACHE: false
      - run: pnpm update -r --no-save
      - run: cat pnpm-lock.yaml
      - run: git config --global user.email "tmp@xwiki.org"
      - run: git config --global user.name "XWiki Dev Team"
      - run: git commit -am "commit updated lockfile"
      - run: pnpm run build
      - run: pnpm run --filter @xwiki/cristal-electron build:win
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: cristal-win
          path: |
            electron/dist/cristal-*.*
            electron/dist/latest*.yml
          retention-days: 14
          # The files are already compressed installers, deflating them again only slows the upload down.
          compression-level: 0
          if-no-files-found: error
